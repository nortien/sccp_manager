name: Build release tarball

# A pushed v* tag is a release: the first job creates the GitHub release for
# it (text = the annotated tag message) unless one exists, then the tarball
# with the bundled chan_sccp.so binaries is built and attached. Manual runs
# against an existing tag rebundle and re-attach (--clobber).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)bundle and attach the tarball to (e.g. v17.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: GitHub release for the tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create the release from the tag unless it exists
        run: |
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # GitHub turns a release into a draft when its tag is deleted or moved;
            # uploads to a draft succeed but nobody can see them. Publish it again.
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "release $TAG is a draft - publishing it"
              gh release edit "$TAG" --repo "$REPO" --draft=false
            else
              echo "release $TAG exists"
            fi
            exit 0
          fi
          # The release text is the annotated tag's message. This job has no
          # checkout, so read it through the API rather than from git.
          TYPE=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$TYPE" = "tag" ]; then
            SHA=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
            gh api "repos/$REPO/git/tags/$SHA" --jq '.message' > notes.md
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
          fi

  bundle:
    name: sccp_manager tarball (with bundled chan_sccp.so binaries)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sccp_manager
          # Bundle the source the release tag actually points at, not
          # whatever the default branch happens to be at dispatch time.
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Fetch precompiled driver binaries from chan-sccp's latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sccp_manager/drivers
          # Pull every chan_sccp-ast<major>-<distro>.so asset. install.php /
          # install-chan-sccp-driver.sh picks the one matching the target box
          # at install time; shipping them all is what lets an air-gapped PBX
          # install the driver with no route to github.com.
          gh release download --repo nortien/chan-sccp \
            --pattern 'chan_sccp-ast*-*.so' \
            --dir sccp_manager/drivers
          echo "Bundled binaries:"
          ls -la sccp_manager/drivers

      - name: Sanity-check the bundle before publishing it
        run: |
          # A tarball that ships a truncated or HTML-error-page "binary" is
          # worse than one that ships none - it would be installed as
          # chan_sccp.so and fail at Asterisk load time, far from the cause.
          count=$(find sccp_manager/drivers -name 'chan_sccp-ast*.so' | wc -l)
          [ "$count" -gt 0 ] || { echo "No driver binaries downloaded"; exit 1; }
          for so in sccp_manager/drivers/*.so; do
            file "$so" | grep -qi 'ELF 64-bit' || { echo "Not an ELF binary: $so"; exit 1; }
          done
          echo "$count driver binaries verified"
          test -f sccp_manager/module.xml || { echo "module.xml missing - wrong tarball layout"; exit 1; }

      - name: Build the tarball
        run: |
          # FreePBX's Module Admin expects the module's own directory name at
          # the archive root, so pack ./sccp_manager, not its contents.
          rm -rf sccp_manager/.git sccp_manager/.github
          tar -czf sccp_manager.tar.gz sccp_manager
          ls -lh sccp_manager.tar.gz

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # --repo is required, not optional: gh normally infers it from the
          # git remote of the working directory, but the checkout lives in a
          # subdirectory here and its .git is stripped when building the
          # tarball, so there's nothing for gh to infer from.
          gh release upload "$TAG" sccp_manager.tar.gz \
            --repo "${{ github.repository }}" --clobber
